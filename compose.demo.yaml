name: testnet-wallet-demo
services:
  app:
    image: ${APP_IMAGE:?Set immutable APP_IMAGE digest}
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 1.0
    stop_grace_period: 45s
    environment:
      HTTP_HOST: 0.0.0.0
      PORT: "8090"
      GOMEMLIMIT: 480MiB
      WALLET_DIR: /data/wallet
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set HTTPS PUBLIC_ORIGIN}
      WALLET_ACCESS_TOKEN: ${WALLET_ACCESS_TOKEN:-}
      SEPOLIA_VAULT_ADDRESS: ${SEPOLIA_VAULT_ADDRESS:-}
      TEST_FAUCET_CONFIG: ${TEST_FAUCET_CONFIG:-}
      SHARED_DEMO: ${SHARED_DEMO:-false}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      SEPOLIA_RPC_FALLBACK_URLS: ${SEPOLIA_RPC_FALLBACK_URLS:-}
      ARBITRUM_SEPOLIA_RPC_URL: ${ARBITRUM_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      ARBITRUM_SEPOLIA_RPC_FALLBACK_URLS: ${ARBITRUM_SEPOLIA_RPC_FALLBACK_URLS:-}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      BASE_SEPOLIA_RPC_FALLBACK_URLS: ${BASE_SEPOLIA_RPC_FALLBACK_URLS:-}
      OP_SEPOLIA_RPC_URL: ${OP_SEPOLIA_RPC_URL:-https://sepolia.optimism.io}
      OP_SEPOLIA_RPC_FALLBACK_URLS: ${OP_SEPOLIA_RPC_FALLBACK_URLS:-}
      POLYGON_AMOY_RPC_URL: ${POLYGON_AMOY_RPC_URL:-https://polygon-amoy.drpc.org}
      POLYGON_AMOY_RPC_FALLBACK_URLS: ${POLYGON_AMOY_RPC_FALLBACK_URLS:-}
      SOLANA_DEVNET_RPC_URL: ${SOLANA_DEVNET_RPC_URL:-https://api.devnet.solana.com}
      TRON_SHASTA_RPC_URL: ${TRON_SHASTA_RPC_URL:-https://api.shasta.trongrid.io}
      TRON_SHASTA_API_KEY: ${TRON_SHASTA_API_KEY:-}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - type: bind
        source: ./wallet
        target: /data/wallet
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
